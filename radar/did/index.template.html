<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>D-id you know it? — Radar</title>
<meta name="description" content="Grafo delle scelte Radar: giocatori, club, uscite e verifiche collegate.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231f5f4a'/><text x='16' y='22' font-family='Georgia' font-size='14' fill='white' text-anchor='middle'>D</text></svg>">
<style>
:root{
  --ink:#1c1c1c;--muted:#5a5a5a;--line:#dcdcd6;--bg:#fafaf7;--paper:#fff;
  --accent:#1f5f4a;--club:#3d4a6b;--check:#8a6a2f;--release:#1c1c1c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.wordmark{font:normal 1.55rem/1.1 Georgia,"Times New Roman",serif}
.wordmark em{font-style:normal;color:var(--accent)}
.sub{display:block;margin-top:5px;font:600 11px/1.3 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.back{font:500 13px/1 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.search{padding:12px 18px 0}
.search input{width:100%;min-height:44px;border:1px solid var(--line);background:var(--paper);padding:10px 12px;border-radius:0}
.search input:focus{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:block;padding:10px 18px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chip,.seg button{flex:none;min-height:36px;padding:8px 12px;border:1px solid var(--ink);background:transparent;cursor:pointer}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg{display:flex;border:1px solid var(--ink);flex:none}
.seg button{border:0;border-left:1px solid var(--ink)}
.seg button:first-child{border-left:0}
#stage{padding:0 8px}
#canvas{width:100%;height:min(42vh,400px);display:block}
#canvas[hidden],#list[hidden],.legend[hidden],
body.is-list #canvas,body.is-list .legend{display:none !important}
body.is-list #list{display:block !important}
.node{cursor:pointer}
.node circle,.node rect{stroke:#fff;stroke-width:2}
.node text{font:600 11px/1.15 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.node.is-dim{opacity:.22}
.node.is-on circle,.node.is-on rect{stroke:var(--ink);stroke-width:2.5}
.edge{stroke:#c8c8c0;stroke-width:1.25;fill:none}
.edge.is-on{stroke:var(--ink);stroke-width:2}
.edge.is-dim{opacity:.12}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:4px 18px 10px;font:12px/1 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.list{list-style:none;padding:0 18px 20px}
.list li{border-top:1px solid var(--line)}
.list button{width:100%;text-align:left;background:none;border:0;padding:14px 0;cursor:pointer;min-height:52px}
.list b{display:block;font:normal 1.15rem/1.25 Georgia,serif}
.list span{color:var(--muted);font-size:14px}
.sheet{border-top:2px solid var(--ink);background:var(--paper);padding:16px 18px 28px;min-height:170px}
.k{font:600 12px/1.3 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sheet h2{font:normal 1.5rem/1.2 Georgia,"Times New Roman",serif;margin:6px 0 8px;color:var(--ink);text-transform:none;letter-spacing:0}
.sheet p{margin:0 0 8px;color:var(--muted)}
.sheet ul{margin:8px 0 0 18px}
.sheet li{margin:0 0 4px}
.hint{color:var(--muted)}
.empty-ev{border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin-top:10px}
@media(min-width:800px){
  .frame{max-width:980px;margin:0 auto}
  #canvas{height:560px}
}
</style>
</head>
<body>
<div class="frame">
  <header class="top">
    <div>
      <div class="wordmark"><em>D-id</em> you know it?</div>
      <span class="sub">Radar · Serie D · 2026/27</span>
    </div>
    <div class="top-right">
      <div class="seg" role="group" aria-label="Vista">
        <button data-view="graph" aria-pressed="true" type="button">Grafo</button>
        <button data-view="list" aria-pressed="false" type="button">Elenco</button>
      </div>
      <a class="back" href="/radar/">Uscita 01</a>
    </div>
  </header>
  <div class="search">
    <label class="visually-hidden" for="q" style="position:absolute;left:-999px">Cerca</label>
    <input id="q" type="search" placeholder="Cerca un giocatore o un club" autocomplete="off">
  </div>
  <div class="toolbar">
    <div class="chips" role="toolbar" aria-label="Domande">
      <button class="chip" data-q="all" aria-pressed="true" type="button">Tutti</button>
      <button class="chip" data-q="same-club" aria-pressed="false" type="button">Stesso club</button>
      <button class="chip" data-q="checks" aria-pressed="false" type="button">Verifiche</button>
    </div>
  </div>
  <div id="stage">
    <svg id="canvas" viewBox="0 0 390 430" role="img" aria-label="Grafo delle scelte"></svg>
    <ul class="list" id="list" hidden></ul>
  </div>
  <p class="legend">
    <span><i style="background:#1f5f4a"></i>Giocatore</span>
    <span><i style="background:#3d4a6b"></i>Club</span>
    <span><i style="background:#1c1c1c"></i>Uscita</span>
    <span><i style="background:#8a6a2f"></i>Verifica</span>
  </p>
  <aside class="sheet" id="sheet" aria-live="polite"></aside>
</div>
<script type="application/json" id="graph-data"><!--GRAPH_JSON--></script>
<script>
(function(){
  const data = JSON.parse(document.getElementById("graph-data").textContent);
  const nodes = data.nodes || [];
  const edges = data.edges || [];
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const players = nodes.filter(n => n.type === "player");
  const clubs = nodes.filter(n => n.type === "club");
  const releases = nodes.filter(n => n.type === "release");
  const checks = nodes.filter(n => n.type === "check");
  const picks = nodes.filter(n => n.type === "pick");

  const neighbors = {};
  function link(a,b){ (neighbors[a] ||= new Set()).add(b); (neighbors[b] ||= new Set()).add(a); }
  edges.forEach(e => link(e.source, e.target));

  function picksFor(playerId){
    return edges.filter(e => e.type === "identifies" && e.target === playerId)
      .map(e => byId[e.source]).filter(Boolean);
  }
  function clubFor(playerId){
    const e = edges.find(x => x.type === "plays_for" && x.source === playerId);
    return e ? byId[e.target] : null;
  }
  function releaseForPick(pickId){
    const e = edges.find(x => x.type === "chosen_in" && x.source === pickId);
    return e ? byId[e.target] : null;
  }
  function clubPlayers(clubId){
    return edges.filter(e => e.type === "plays_for" && e.target === clubId).map(e => byId[e.source]);
  }
  function releaseChecks(releaseId){
    return edges.filter(e => e.type === "has_check" && e.source === releaseId).map(e => byId[e.target]);
  }
  function playerEvidence(playerId){
    return edges.filter(e => e.type === "has_evidence" && e.source === playerId).map(e => byId[e.target]);
  }

  const MONTHS = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  function niceDate(iso, approx){
    if(!iso) return "";
    const [y,m,d] = iso.split("-").map(Number);
    const s = d + " " + MONTHS[m-1] + " " + y;
    return approx ? "intorno al " + s : s;
  }

  const svg = document.getElementById("canvas");
  const W = 390, H = 430, CX = 195, CY = 188;
  const positions = {};

  function layout(){
    const rel = releases[0];
    if(rel) positions[rel.id] = {x:CX, y:CY};
    players.forEach((p,i) => {
      const a = (-Math.PI/2) + (i * 2 * Math.PI / players.length);
      positions[p.id] = {x: CX + Math.cos(a)*118, y: CY + Math.sin(a)*102};
    });
    clubs.forEach(c => {
      const ps = clubPlayers(c.id);
      let sx=0, sy=0, n=0;
      ps.forEach(p => {
        const pt = positions[p.id];
        if(!pt) return;
        const dx = pt.x-CX, dy = pt.y-CY;
        const L = Math.hypot(dx,dy) || 1;
        sx += dx/L; sy += dy/L; n++;
      });
      if(!n){ positions[c.id] = {x:CX, y:CY}; return; }
      const mag = Math.hypot(sx,sy);
      let ang;
      if(mag < 0.35){
        const pt = positions[ps[0].id];
        ang = Math.atan2(pt.y-CY, pt.x-CX);
      } else {
        ang = Math.atan2(sy, sx);
      }
      positions[c.id] = {x: CX + Math.cos(ang)*168, y: CY + Math.sin(ang)*148};
    });
    checks.forEach((c,i) => {
      const gap = 390 / (checks.length + 1);
      positions[c.id] = {x: gap*(i+1), y: 392};
    });
  }

  function lastName(label){
    const parts = (label||"").split(" ");
    return parts[parts.length-1] || label;
  }

  let selected = null;
  let query = "all";
  let view = "graph";
  let search = "";

  function matchSearch(n){
    if(!search) return true;
    const hay = (n.label+" "+(n.name||"")+" "+(n.pick_id||"")).toLowerCase();
    return hay.includes(search);
  }

  function focusSet(){
    const set = new Set();
    if(selected){
      set.add(selected);
      (neighbors[selected]||[]).forEach(id => set.add(id));
      return set;
    }
    if(search){
      nodes.forEach(n => { if(matchSearch(n)) set.add(n.id); });
      set.forEach(id => (neighbors[id]||[]).forEach(j => set.add(j)));
      return set;
    }
    if(query === "same-club"){
      clubs.forEach(c => {
        const ps = clubPlayers(c.id);
        if(ps.length > 1){ set.add(c.id); ps.forEach(p => set.add(p.id)); }
      });
      releases.forEach(r => set.add(r.id));
      return set;
    }
    if(query === "checks"){
      checks.forEach(c => set.add(c.id));
      releases.forEach(r => set.add(r.id));
      return set;
    }
    return null;
  }

  function draw(){
    const focus = focusSet();
    const visualEdges = edges.filter(e =>
      (e.type === "plays_for" || e.type === "selected_in" || e.type === "has_check") &&
      positions[e.source] && positions[e.target]
    );
    let markup = "";
    visualEdges.forEach(e => {
      const a = positions[e.source], b = positions[e.target];
      const on = !focus || (focus.has(e.source) && focus.has(e.target));
      markup += `<line class="edge${on?(focus?" is-on":""):" is-dim"}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"></line>`;
    });
    function nodeMark(n, r, fill, label, shape, inside){
      if(!positions[n.id]) return "";
      const p = positions[n.id];
      const on = !focus || focus.has(n.id);
      const cls = `node${on?(selected===n.id?" is-on":""):" is-dim"}`;
      const shapeEl = shape === "sq"
        ? `<rect x="${p.x-r}" y="${p.y-r}" width="${r*2}" height="${r*2}" fill="${fill}"></rect>`
        : `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fill}"></circle>`;
      if(inside){
        return `<g class="${cls}" data-id="${n.id}">${shapeEl}<text x="${p.x}" y="${p.y+4}" text-anchor="middle" style="fill:#fafaf7;stroke:none;font-size:10px">${label}</text></g>`;
      }
      const dy = shape === "sq" ? r+14 : r+13;
      return `<g class="${cls}" data-id="${n.id}">${shapeEl}<text x="${p.x}" y="${p.y+dy}" text-anchor="middle">${label}</text></g>`;
    }
    clubs.forEach(c => { markup += nodeMark(c, 9, "#3d4a6b", c.label, "c"); });
    players.forEach(p => { markup += nodeMark(p, 11, "#1f5f4a", lastName(p.label), "c"); });
    releases.forEach(r => { markup += nodeMark(r, 18, "#1c1c1c", "01", "c", true); });
    checks.forEach(c => {
      const short = c.date ? c.date.slice(8)+"/"+c.date.slice(5,7) : c.label;
      markup += nodeMark(c, 8, "#8a6a2f", short, "sq");
    });
    svg.innerHTML = markup;
    svg.querySelectorAll(".node").forEach(g => {
      g.addEventListener("click", () => select(g.getAttribute("data-id")));
    });
  }

  function renderList(){
    const items = players.filter(p => {
      if(search && !matchSearch(p) && !matchSearch(clubFor(p.id)||{})) return false;
      if(query === "same-club"){
        const c = clubFor(p.id);
        return c && clubPlayers(c.id).length > 1;
      }
      return true;
    });
    document.getElementById("list").innerHTML = items.map(p => {
      const c = clubFor(p.id);
      const pk = picksFor(p.id)[0];
      return `<li><button type="button" data-id="${p.id}"><b>${p.label}</b><span>${pk?pk.label+" · ":""}${c?c.label:""}</span></button></li>`;
    }).join("") || `<li style="padding:16px 0;color:#5a5a5a">Nessun nome coincide.</li>`;
    document.getElementById("list").querySelectorAll("button[data-id]").forEach(b => {
      b.addEventListener("click", () => select(b.getAttribute("data-id")));
    });
  }

  function sheetFor(id){
    const n = byId[id];
    if(!n){
      return `<p class="hint">Tocca un giocatore, un club o una data di verifica per vedere come sono legati.</p>
        <p class="hint">Ogni uscita allarga questo grafo: lo stesso giocatore resta un solo nodo se ricompare.</p>`;
    }
    if(n.type === "player"){
      const c = clubFor(n.id);
      const pks = picksFor(n.id);
      const ev = playerEvidence(n.id);
      const rels = pks.map(pk => releaseForPick(pk.id)).filter(Boolean);
      const chks = rels.flatMap(r => releaseChecks(r.id));
      return `<div class="k">${pks.map(p=>p.label).join(" · ")||"Giocatore"}</div>
        <h2>${n.label}</h2>
        <p>${c?c.label:""}${rels.length? " · "+rels.map(r=>r.label).join(", "):""}</p>
        ${chks.length? `<p>Verifiche: ${chks.map(c=>niceDate(c.date,c.approx)).join("; ")}.</p>`:""}
        <div class="empty-ev">${ev.length
          ? ev.map(e => (e.evidence_type||"prova")+(e.date?" · "+e.date:"")).join("<br>")
          : "Nessuna prova video ancora. Si può agganciare all’id, senza cambiare la scelta."}</div>`;
    }
    if(n.type === "club"){
      const ps = clubPlayers(n.id);
      return `<div class="k">Club</div><h2>${n.label}</h2>
        <p>${ps.length} ${ps.length===1?"giocatore scelto":"giocatori scelti"} in questa rete.</p>
        <ul>${ps.map(p=>`<li>${p.label}</li>`).join("")}</ul>`;
    }
    if(n.type === "release"){
      const count = edges.filter(e => e.type==="selected_in" && e.target===n.id).length;
      return `<div class="k">${n.written?niceDate(n.written):""}</div>
        <h2>${n.label}</h2>
        <p>${count} scelte · stagione ${n.season||""}.</p>
        <p><a href="/radar/">Apri la pagina pubblica dell’uscita</a></p>`;
    }
    if(n.type === "check"){
      const rel = edges.filter(e => e.type==="has_check" && e.target===n.id).map(e=>byId[e.source])[0];
      return `<div class="k">Verifica</div>
        <h2>${niceDate(n.date, n.approx)}</h2>
        <p>Data dichiarata in anticipo${rel? " per "+rel.label:""}. L’esito si aggiunge, senza riscrivere le scelte.</p>`;
    }
    return `<div class="k">${n.type}</div><h2>${n.label}</h2>`;
  }

  function select(id){
    selected = (selected === id) ? null : id;
    document.getElementById("sheet").innerHTML = sheetFor(selected);
    draw();
  }

  function setView(v){
    view = v;
    document.body.classList.toggle("is-list", v === "list");
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view===v ? "true":"false"));
    document.getElementById("canvas").hidden = v !== "graph";
    document.getElementById("list").hidden = v !== "list";
    document.querySelector(".legend").hidden = v !== "graph";
    if(v==="list") renderList();
  }

  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    query = b.dataset.q;
    document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x===b ? "true":"false"));
    selected = null;
    document.getElementById("sheet").innerHTML = sheetFor(null);
    if(query==="checks"){
      /* keep graph but focus checks */
    }
    draw();
    if(view==="list") renderList();
    if(query==="checks"){
      document.getElementById("sheet").innerHTML = `<div class="k">Verifiche dichiarate</div><h2>Date già scritte</h2><ul>${checks.map(c=>`<li>${niceDate(c.date,c.approx)}</li>`).join("")}</ul>`;
    }
    if(query==="same-club"){
      const doubles = clubs.filter(c => clubPlayers(c.id).length>1);
      document.getElementById("sheet").innerHTML = `<div class="k">Stesso club</div><h2>${doubles.length} club con più scelte</h2>
        <ul>${doubles.map(c=>`<li>${c.label}: ${clubPlayers(c.id).map(p=>p.label).join(", ")}</li>`).join("")}</ul>`;
    }
  }));
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
  document.getElementById("q").addEventListener("input", e => {
    search = (e.target.value||"").trim().toLowerCase();
    selected = null;
    document.getElementById("sheet").innerHTML = sheetFor(null);
    draw();
    if(view==="list") renderList();
  });

  layout();
  document.getElementById("sheet").innerHTML = sheetFor(null);
  draw();
  renderList();
  const params = new URLSearchParams(location.search);
  if(params.get("vista")==="elenco") setView("list");
  const filtro = params.get("filtro");
  if(filtro && document.querySelector('.chip[data-q="'+filtro+'"]')){
    document.querySelector('.chip[data-q="'+filtro+'"]').click();
  }
  const preset = params.get("nodo");
  if(preset && byId[preset]) select(preset);
})();
</script>
</body>
</html>
